<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cindy, this is for you</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: #74070E;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      padding: 1.5rem;
      margin: 0;
      color: #1e1e1e;
    }
    .card {
      background: white;
      max-width: 620px;
      width: 100%;
      padding: 2rem 2rem 2.5rem;
      border-radius: 2.5rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15), 0 8px 20px rgba(0, 0, 0, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      text-align: center;
      transition: all 0.2s;
      position: relative;
    }
    h2 {
      font-weight: 500;
      font-size: 1.6rem;
      letter-spacing: -0.01em;
      margin-bottom: 2rem;
      color: #111;
      line-height: 1.3;
      transition: all 0.3s ease;
    }
    .form-group {
      margin: 1.8rem 0 2rem;
      transition: all 0.3s ease;
    }
    input {
      width: 100%;
      padding: 1rem 1.2rem;
      font-size: 1.2rem;
      border: 2px solid #d0d0d0;
      border-radius: 60px;
      outline: none;
      background: white;
      transition: 0.2s;
      color: #1a1a1a;
      letter-spacing: 0.3px;
      text-align: center;
      font-weight: 400;
    }
    input:focus {
      border-color: #74070E;
      box-shadow: 0 0 0 3px rgba(116, 7, 14, 0.15);
    }
    input:disabled {
      opacity: 0.6;
      background: #f5f5f5;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
      margin: 1.5rem 0 1rem;
      transition: all 0.3s ease;
    }
    .btn {
      background: #f0f0f0;
      border: none;
      padding: 0.9rem 1.8rem;
      border-radius: 60px;
      font-size: 1.1rem;
      font-weight: 500;
      color: #2b2b2b;
      cursor: pointer;
      transition: 0.2s;
      border: 1px solid transparent;
      letter-spacing: 0.3px;
    }
    .btn-primary {
      background: #1e1e1e;
      color: white;
      border-color: #1e1e1e;
    }
    .btn-primary:active {
      transform: scale(0.97);
    }
    .btn-primary:disabled {
      opacity: 0.4;
      pointer-events: none;
      filter: grayscale(0.5);
    }
    .btn-secondary {
      background: transparent;
      border: 1px solid #c0c0c0;
      color: #2b2b2b;
    }
    .btn-secondary:hover {
      background: #f5f5f5;
      border-color: #a0a0a0;
    }
    .hint-box {
      margin: 1.8rem 0 0.5rem;
      padding: 1.2rem 1.5rem;
      background: #fafafa;
      border-radius: 40px;
      border-left: 4px solid #74070E;
      font-size: 0.95rem;
      line-height: 1.6;
      color: #1e1e1e;
      text-align: left;
      display: none;
      box-shadow: 0 2px 8px rgba(0,0,0,0.01);
      word-break: break-word;
      transition: all 0.3s ease;
    }
    .hint-box.show {
      display: block;
    }
    /* hide question & form when slider is active */
    .card.revealed h2,
    .card.revealed .form-group,
    .card.revealed .btn-group {
      display: none;
    }
    .card.revealed .hint-box {
      display: none !important;
    }
    .slider-section {
      margin: 0 auto;
      width: 100%;
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
    }
    .slider-section.active {
      display: flex;
    }
    .slider-container {
      position: relative;
      width: 100%;
      max-width: 400px;
      aspect-ratio: 1/1;
      overflow: hidden;
      border-radius: 28px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.06);
      border: 1px solid #ececec;
      background: #fafafa;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .slider-track {
      display: flex;
      transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
      width: 100%;
      height: 100%;
    }
    .slider-track img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      flex-shrink: 0;
      display: block;
    }
    .slider-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(30, 30, 30, 0.25);
      backdrop-filter: blur(2px);
      color: rgba(255, 255, 255, 0.7);
      border: none;
      width: 40px;
      height: 40px;
      border-radius: 40px;
      font-size: 1.6rem;
      cursor: pointer;
      transition: 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
      font-weight: 300;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      z-index: 2;
      padding: 0;
    }
    .slider-btn:hover {
      background: rgba(30, 30, 30, 0.4);
      color: white;
    }
    .slider-btn.prev {
      left: 8px;
    }
    .slider-btn.next {
      right: 8px;
    }
    .slider-dots {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-top: 0.2rem;
    }
    .slider-dots span {
      width: 8px;
      height: 8px;
      border-radius: 8px;
      background: #d0d0d0;
      transition: 0.2s;
      cursor: pointer;
    }
    .slider-dots span.active {
      background: #74070E;
      width: 24px;
    }
    .toast {
      position: fixed;
      top: 2rem;
      left: 50%;
      transform: translateX(-50%) scale(0.96);
      background: #1e1e1e;
      color: #f5f0ec;
      padding: 1rem 2.5rem;
      border-radius: 80px;
      font-size: 1.2rem;
      font-weight: 450;
      letter-spacing: 0.3px;
      box-shadow: 0 16px 40px rgba(0,0,0,0.25);
      opacity: 0;
      transition: opacity 0.2s ease, transform 0.2s ease;
      pointer-events: none;
      z-index: 999;
      border: 1px solid #3d3d3d;
      white-space: nowrap;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) scale(1);
      pointer-events: auto;
    }
    #cindyAudio {
      display: none;
    }
    @media (max-width: 480px) {
      .card { padding: 1.8rem 1.2rem; }
      h2 { font-size: 1.3rem; }
      input { font-size: 1rem; padding: 0.8rem 1rem; }
      .slider-btn { width: 34px; height: 34px; font-size: 1.3rem; }
      .slider-btn.prev { left: 6px; }
      .slider-btn.next { right: 6px; }
    }
  </style>
</head>
<body>

<div class="card" id="appCard">
  <h2>The Title of The Song?</h2>

  <div class="form-group">
    <input type="text" id="answerInput" placeholder="type your answer..." autocomplete="off" />
  </div>

  <div class="btn-group">
    <button class="btn btn-primary" id="nextBtn" disabled>Next →</button>
    <button class="btn btn-secondary" id="hintToggleBtn">Hint</button>
  </div>

  <div id="hintBox" class="hint-box">
     Call me now, call me later, or call me whenever. Call me friend, call me lover, or call me whatever, Cindy.
  </div>

  <!-- slider section (hidden until correct answer) -->
  <div id="sliderSection" class="slider-section">
    <div class="slider-container">
      <div class="slider-track" id="sliderTrack">
        <img src="Callcindy1.jpg" alt="Cindy 1" />
        <img src="Callcindy2.jpg" alt="Cindy 2" />
        <img src="Callcindy3.jpg" alt="Cindy 3" />
        <img src="Callcindy4.jpg" alt="Cindy 4" />
        <img src="Callcindy5.jpg" alt="Cindy 5" />
        <img src="Callcindy6.png" alt="Cindy 6" />
      </div>
      <button class="slider-btn prev" id="prevBtn">‹</button>
      <button class="slider-btn next" id="nextBtnSlider">›</button>
    </div>
    <div class="slider-dots" id="sliderDots"></div>
    <audio id="cindyAudio" autoplay loop>
      <source src="Callcindy.mp3" type="audio/mp3" />
    </audio>
  </div>
</div>

<div id="toastMessage" class="toast">TETOT! Wrong answer! Try again, Cindy!</div>

<script>
  (function() {
    const appCard = document.getElementById('appCard');
    const answerInput = document.getElementById('answerInput');
    const nextBtn = document.getElementById('nextBtn');
    const hintToggleBtn = document.getElementById('hintToggleBtn');
    const hintBox = document.getElementById('hintBox');
    const sliderSection = document.getElementById('sliderSection');
    const sliderTrack = document.getElementById('sliderTrack');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtnSlider = document.getElementById('nextBtnSlider');
    const dotsContainer = document.getElementById('sliderDots');
    const cindyAudio = document.getElementById('cindyAudio');
    const toast = document.getElementById('toastMessage');

    const CORRECT = 'call you mine';
    let toastTimer = null;
    let currentIndex = 0;
    const totalSlides = 6;

    // ---- input validation ----
    function validateInput() {
      const val = answerInput.value.trim();
      nextBtn.disabled = val.length === 0;
    }
    answerInput.addEventListener('input', validateInput);

    // ---- hint toggle ----
    hintToggleBtn.addEventListener('click', function() {
      hintBox.classList.toggle('show');
    });

    // ---- toast ----
    function showToast() {
      toast.classList.add('show');
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.remove('show');
        toastTimer = null;
      }, 2500);
    }

    // ---- slider logic ----
    function updateSlider(index) {
      if (index < 0) index = totalSlides - 1;
      if (index >= totalSlides) index = 0;
      currentIndex = index;
      sliderTrack.style.transform = `translateX(-${currentIndex * 100}%)`;
      document.querySelectorAll('.slider-dots span').forEach((dot, i) => {
        dot.classList.toggle('active', i === currentIndex);
      });
    }

    function initSlider() {
      dotsContainer.innerHTML = '';
      for (let i = 0; i < totalSlides; i++) {
        const dot = document.createElement('span');
        dot.addEventListener('click', () => updateSlider(i));
        dotsContainer.appendChild(dot);
      }
      updateSlider(0);
    }

    prevBtn.addEventListener('click', () => updateSlider(currentIndex - 1));
    nextBtnSlider.addEventListener('click', () => updateSlider(currentIndex + 1));

    // ---- show slider & hide question ----
    function showSlider() {
      // hide question, form, buttons, hint
      appCard.classList.add('revealed');
      sliderSection.classList.add('active');
      initSlider();
      // autoplay audio (hidden)
      cindyAudio.load();
      cindyAudio.play().catch(() => {});
    }

    // ---- handle "Next" ----
    nextBtn.addEventListener('click', function() {
      const userAnswer = answerInput.value.trim();
      
      if (userAnswer.toLowerCase() !== CORRECT) {
        showToast();
        return;
      }

      // correct
      answerInput.disabled = true;
      nextBtn.disabled = true;
      
      showSlider();
    });

    // ---- enter key ----
    answerInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        if (!nextBtn.disabled) {
          nextBtn.click();
        }
      }
    });

    // ---- init ----
    validateInput();
    answerInput.focus();

  })();
</script>
</body>
</html>
